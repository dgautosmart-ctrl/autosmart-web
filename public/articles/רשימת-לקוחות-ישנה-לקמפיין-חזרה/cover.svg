<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="יש לכם רשימת לקוחות ישנה — כך הופכים אותה לקמפיין חזרה שעובד">
  <defs>
