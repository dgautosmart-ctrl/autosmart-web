  <rect x="880" y="218" width="160" height="28" rx="4" fill="#2b93c9" fill-opacity="0.22"/>
  <rect x="900" y="266" width="120" height="28" rx="4" fill="#2b93c9" fill-opacity="0.28"/>
  <rect x="920" y="314" width="80" height="28" rx="4" fill="#6ec9e8" fill-opacity="0.35"/>

