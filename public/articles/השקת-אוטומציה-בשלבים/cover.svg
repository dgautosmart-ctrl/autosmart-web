<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="לא נותנים ל-AI לשלוח ביום הראשון: איך משיקים אוטומציה רגישה בשלבים">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2440"/>
      <stop offset="0.55" stop-color="#123a5c"/>
      <stop offset="1" stop-color="#2b93c9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b93c9"/>
      <stop offset="1" stop-color="#6ec9e8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric network -->
  <g>
    <line x1="150" y1="100" x2="380" y2="60" stroke="#6ec9e8" stroke-width="1.25" stroke-opacity="0.05"/>
    <line x1="380" y1="60" x2="600" y2="110" stroke="#6ec9e8" stroke-width="1.25" stroke-opacity="0.06"/>
    <line x1="600" y1="110" x2="840" y2="70" stroke="#6ec9e8" stroke-width="1.25" stroke-opacity="0.04"/>
    <line x1="840" y1="70" x2="1100" y2="130" stroke="#6ec9e8" stroke-width="1.25" stroke-opacity="0.07"/>
    <line x1="150" y1="100" x2="200" y2="320" stroke="#6ec9e8" stroke-width="1.25" stroke-opacity="0.05"/>
    <line x1="200" y1="320" x2="160" y2="520" stroke="#6ec9e8" stroke-width="1.25" stroke-opacity="0.04"/>
    <line x1="380" y1="60" x2="440" y2="350" stroke="#6ec9e8" stroke-width="1.25" stroke-opacity="0.04"/>
    <line x1="600" y1="110" x2="580" y2="400" stroke="#6ec9e8" stroke-width="1.25" stroke-opacity="0.05"/>
    <line x1="840" y1="70" x2="820" y2="360" stroke="#6ec9e8" stroke-width="1.25" stroke-opacity="0.04"/>
    <line x1="1100" y1="130" x2="1080" y2="370" stroke="#6ec9e8" stroke-width="1.25" stroke-opacity="0.05"/>
    <line x1="200" y1="320" x2="440" y2="350" stroke="#6ec9e8" stroke-width="1.25" stroke-opacity="0.04"/>
    <line x1="440" y1="350" x2="580" y2="400" stroke="#6ec9e8" stroke-width="1.25" stroke-opacity="0.05"/>
    <line x1="580" y1="400" x2="820" y2="360" stroke="#6ec9e8" stroke-width="1.25" stroke-opacity="0.04"/>
    <line x1="820" y1="360" x2="1080" y2="370" stroke="#6ec9e8" stroke-width="1.25" stroke-opacity="0.04"/>
    <circle cx="150" cy="100" r="5" fill="#6ec9e8" fill-opacity="0.28"/>
    <circle cx="380" cy="60" r="4" fill="#6ec9e8" fill-opacity="0.28"/>
    <circle cx="600" cy="110" r="6" fill="#6ec9e8" fill-opacity="0.28"/>
    <circle cx="840" cy="70" r="4" fill="#6ec9e8" fill-opacity="0.28"/>
    <circle cx="1100" cy="130" r="5" fill="#6ec9e8" fill-opacity="0.28"/>
    <circle cx="200" cy="320" r="5" fill="#6ec9e8" fill-opacity="0.28"/>
    <circle cx="440" cy="350" r="4" fill="#6ec9e8" fill-opacity="0.28"/>
    <circle cx="580" cy="400" r="6" fill="#6ec9e8" fill-opacity="0.28"/>
    <circle cx="820" cy="360" r="4" fill="#6ec9e8" fill-opacity="0.28"/>
    <circle cx="1080" cy="370" r="5" fill="#6ec9e8" fill-opacity="0.28"/>
    <circle cx="160" cy="520" r="4" fill="#6ec9e8" fill-opacity="0.28"/>
  </g>

  <!-- Step progression: 3 circles connected -->
  <circle cx="910" cy="190" r="22" fill="#2b93c9" fill-opacity="0.22" stroke="#6ec9e8" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="932" y1="190" x2="958" y2="190" stroke="#6ec9e8" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="980" cy="190" r="22" fill="#2b93c9" fill-opacity="0.22" stroke="#6ec9e8" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="1002" y1="190" x2="1028" y2="190" stroke="#6ec9e8" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="1050" cy="190" r="22" fill="#6ec9e8" fill-opacity="0.30" stroke="#6ec9e8" stroke-width="1.5" stroke-opacity="0.55"/>
  <!-- checkmark in last step -->
  <polyline points="1041,190 1047,197 1059,182" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-opacity="0.8"/>

  <rect x="80" y="498" width="132" height="6" rx="3" fill="url(#accent)"/>

  <text x="80" y="82" font-family="'IBM Plex Sans Hebrew','Rubik','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="0.5" fill="#ffffff">AutoSmart</text>

  <g>
    <rect x="836" y="86" rx="20" ry="20" width="284" height="40" fill="#6ec9e8" fill-opacity="0.16"/>
    <text x="1098" y="112" text-anchor="end" font-family="'IBM Plex Sans Hebrew','Rubik','Segoe UI',Arial,sans-serif" font-size="22" fill="#dff2fb">אוטומציה</text>
  </g>

  <text text-anchor="end" font-family="'IBM Plex Sans Hebrew','Rubik','Segoe UI',Arial,sans-serif" font-size="58" font-weight="700" fill="#ffffff">
    <tspan x="1120" y="248">לא נותנים ל-AI לשלוח</tspan><tspan x="1120" y="324">ביום הראשון: איך משיקים</tspan><tspan x="1120" y="400">אוטומציה רגישה בשלבים</tspan>
  </text>
</svg>
