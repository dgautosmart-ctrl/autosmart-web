    <line x1="1060" y1="310" x2="900" y2="470" stroke="#6ec9e8" stroke-width="1.25" stroke-opacity="0.04"/>
    <line x1="140" y1="260" x2="500" y2="340" stroke="#6ec9e8" stroke-width="1.25" stroke-opacity="0.03"/>
