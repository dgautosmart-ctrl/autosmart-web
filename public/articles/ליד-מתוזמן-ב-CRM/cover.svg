    <circle cx="300" cy="50" r="4" fill="#6ec9e8" fill-opacity="0.28"/>
    <circle cx="560" cy="90" r="6" fill="#6ec9e8" fill-opacity="0.28"/>
    <circle cx="760" cy="40" r="4" fill="#6ec9e8" fill-opacity="0.28"/>
    <circle cx="980" cy="100" r="5" fill="#6ec9e8" fill-opacity="0.28"/>
    <circle cx="1150" cy="60" r="4" fill="#6ec9e8" fill-opacity="0.28"/>
    <circle cx="140" cy="260" r="5" fill="#6ec9e8" fill-opacity="0.28"/>
    <circle cx="500" cy="340" r="6" fill="#6ec9e8" fill-opacity="0.28"/>
    <circle cx="1060" cy="310" r="4" fill="#6ec9e8" fill-opacity="0.28"/>
    <circle cx="80" cy="450" r="4" fill="#6ec9e8" fill-opacity="0.28"/>
