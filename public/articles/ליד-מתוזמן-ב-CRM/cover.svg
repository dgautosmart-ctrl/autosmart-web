  <rect x="860" y="204" width="240" height="32" rx="5" fill="#2b93c9" fill-opacity="0.18"/>
  <rect x="860" y="248" width="240" height="32" rx="5" fill="#6ec9e8" fill-opacity="0.10"/>
  <rect x="860" y="292" width="240" height="32" rx="5" fill="#6ec9e8" fill-opacity="0.10"/>
